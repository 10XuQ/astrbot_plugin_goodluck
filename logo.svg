<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256"
     role="img" aria-label="今日运势">
  <title>今日运势</title>
  <!--
    Minimal wordmark: a rounded-square emerald tile with a single white "运".
    No extra decoration on purpose - it stays legible down to 48px.
    Font stack only matters when re-rasterising; the shipped logo.png is already rendered.
  -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4FD68A"/>
      <stop offset="1" stop-color="#0E9155"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="56" ry="56" fill="url(#tile)"/>
  <text x="128" y="132" text-anchor="middle" dominant-baseline="central"
        font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Source Han Sans SC',sans-serif"
        font-size="132" font-weight="700" fill="#FFFFFF">运</text>
</svg>
