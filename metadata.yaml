name: astrbot_plugin_goodluck
display_name: 今日运势
short_desc: 一条指令查看今日运势，含分数、宜忌与幸运数字/颜色/方位。
desc: |
  随机生成 0~100 的今日运势分数，并给出等级评价、宜做 / 忌做清单、一句话建议，
  以及幸运数字、幸运颜色、幸运方位和黄金时段。

  使用方式：发送 `/今日运势`（别名：`/今日运气`、`/gl`）。

  特点：
  - 结果当天固定：种子由「用户标识 + 日期」派生，同一用户一天内多次查询结果一致，无法反复刷分。
  - 纯本地计算：不依赖任何第三方库、不调用大模型、无需配置 API Key，响应即时。
  - 支持私聊与群聊，群聊可配置是否 @ 发送者。
version: 1.0.0
author: 10XuQ
repo: https://github.com/10XuQ/astrbot_plugin_goodluck
astrbot_version: ">=4.9.2"
tags:
  - 娱乐
  - 运势
  - 趣味
